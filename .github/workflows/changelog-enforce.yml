name: Changelog Enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Dependabot pushes again on every rebase: drop its older run (other runs never share a group).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.head_ref || '', 'dependabot/') }}

jobs:
  changelog:
    runs-on: ${{ fromJSON(startsWith(github.head_ref || github.ref_name, 'dependabot/') && '["ubuntu-24.04"]' || (vars.OVH_COMPOMATE_CI_RUNNER_LABEL == 'ovh-compomate-ci-ephemeral' && '["self-hosted","Linux","X64","ovh-compomate-ci-ephemeral"]' || '["ubuntu-latest"]')) }}
    timeout-minutes: ${{ startsWith(github.head_ref || github.ref_name, 'dependabot/') && 15 || 360 }}  # Dependabot runs on GitHub's servers: stop a hang early
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Enforce changelog update
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}"..HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "$FILES"

          if [[ -z "$FILES" ]]; then
            exit 0
          fi

          if echo "$FILES" | grep -qx "CHANGELOG.md"; then
            exit 0
          fi

          echo "CHANGELOG.md must be updated for shipped or reviewable changes."
          exit 1
