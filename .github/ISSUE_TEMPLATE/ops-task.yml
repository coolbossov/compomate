name: Ops Task
description: Track maintenance, GitHub hygiene, deploy, or internal operations work.
title: "chore: "
labels: ["ops"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety Notes
      description: What must not be changed, deleted, deployed, or exposed?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done When
      description: Verification or acceptance criteria.
    validations:
      required: true
